baseURL: https://lyxwx.top/
paginate: 5
title: 流焰xwx
theme: PaperMod

params:
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  profileMode:
    enabled: true
    title: "流焰xwx" # optional default will be site title
    subtitle: "很高兴认识你"
    #imageUrl: "<image link>" # optional
    #imageTitle: "<title of image as alt>" # optional
    #imageWidth: 120 # custom size
    #imageHeight: 120 # custom size
    buttons:
      - name: 网站源码
        url: "https://github.com/LiuYan-xwx/LiuYan_Website/"
      - name: 站点状态
        url: "https://status.lyxwx.top"

  socialIcons: # optional
    - name: "github"
      url: "https://github.com/LiuYan-xwx/"
    - name: "QQ"
      url: "https://qm.qq.com/q/9EUzkDRSCc"
  analytics:
    google:
      SiteVerificationTag: "G-PZT94GZEYS"

menu:
  main:
    - identifier: home
      name: 主页
      url: /
      weight: 1
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
